<!DOCTYPE html>

    <!-- Always dark: the app has one theme, so native widgets (scrollbars, selects,
         autofill, date inputs) must ignore the OS / browser light preference. -->
    <meta name="color-scheme" content="dark" />

    <meta name="viewport" content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0">

    <!-- Економний режим для слабких пристроїв / повільної мережі: виставляємо data-lite
         до першого кадру, щоб CSS (_lite.scss, _tokens.scss) не «миготів». Явний вибір
         користувача — localStorage['core-league:lite'] = '1' | '0' (див. use-lite-mode.ts). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('core-league:lite');
          if (stored === '1' || stored === '0') {
            if (stored === '1') document.documentElement.dataset.lite = '1';
            return;
          }
          var nav = navigator;
          var conn = nav.connection || nav.mozConnection || nav.webkitConnection;
          var mem = nav.deviceMemory;
          var cores = nav.hardwareConcurrency;
          var slowNet = !!conn && (conn.saveData === true || /(^|-)2g$|3g/.test(conn.effectiveType || ''));
          var weakCpu = (typeof mem === 'number' && mem <= 2) ||
            (typeof cores === 'number' && cores <= 2) ||
            (typeof mem === 'number' && mem <= 4 && typeof cores === 'number' && cores <= 4);
          var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (slowNet || weakCpu || reducedMotion) document.documentElement.dataset.lite = '1';
        } catch (e) { /* no storage / no navigator API — full mode */ }
      })();
    </script>
